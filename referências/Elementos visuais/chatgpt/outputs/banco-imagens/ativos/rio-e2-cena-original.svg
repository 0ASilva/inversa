<svg xmlns="http://www.w3.org/2000/svg" id="board" viewBox="0 0 480 450" role="img" aria-labelledby="board-title board-desc"><title id="board-title">Rio com pedras entre duas margens</title><desc id="board-desc">Você começa na margem inferior esquerda. Há apoios em (0,0), (1,0), (2,0), (3,0), (3,1), (3,2), (3,3), (3,4), (3,5). O tesouro está no último apoio, na margem superior direita. Direita e cima são direções da tela.</desc>
