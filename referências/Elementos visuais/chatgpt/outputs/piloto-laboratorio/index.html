<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inversão · Laboratório gráfico — E4</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><script src="success-audio.js" defer></script><script src="app.js" defer></script><link rel="stylesheet" href="layout.css"><script src="icons.js" defer></script><script src="layout.js" defer></script></head><body data-activity="4"><div id="lab-inversa-v2">

<header class="layout-header"><button id="layout-menu" type="button" aria-label="Abrir etapas" title="Etapas"></button><p class="layout-author">André Silva · IFRJ · Piloto</p><button id="help" type="button" aria-label="Ajuda" title="Ajuda"></button><button id="sound-toggle" type="button" aria-label="Silenciar som das comemorações" aria-pressed="true" title="Som"></button></header><div class="stage-strip" aria-label="Etapas do laboratório"><span id="stage-a">A · Experimentar</span><span id="stage-b">B · Investigar</span></div><h2 id="title">A — Experimentar</h2>
<div id="task" aria-live="polite">Toque em P para começar.</div>
<div class="scene" id="scene"><svg id="plot" role="img" aria-label="Plano cartesiano e reflexão na reta y igual a x"></svg></div>
<div id="coords" class="tabular-nums"></div>
<div id="actions" class="row">
<button class="btn btn-primary" id="start">Animar a partir de P</button>
<button class="btn" id="pause" hidden>Pausar</button>
<button class="btn btn-primary" id="mark" hidden>Marcar o simétrico</button>
<button class="btn advance" id="next" hidden>Continuar</button>
</div>
<div id="explore" hidden>
<div class="sliders"><label class="form-label">Abscissa de P<input class="form-range" id="px" type="range" min="-4" max="4" step="0.1" value="2"></label><label class="form-label">Ordenada de P<input class="form-range" id="py" type="range" min="-4" max="4" step="0.1" value="-1"></label></div>
<div class="row"><label class="form-check"><input class="form-check-input" id="reveal" type="checkbox" checked><span class="form-check-label">Mostrar P'</span></label><button class="btn advance" id="to-number">Continuar</button></div>
</div>
<div id="answers" class="choices" role="group" aria-label="Coordenadas do ponto simétrico" hidden>
<button class="btn" id="answer-0"></button><button class="btn" id="answer-1"></button><button class="btn" id="answer-2"></button><button class="btn" id="answer-3"></button>
</div>
<div id="functions" class="choices" role="group" aria-label="Função e domínio" hidden>
<button class="btn" id="fn-aff">0,75x + 1 · ℝ</button><button class="btn" id="fn-pos">x²/4 · x ≥ 0</button><button class="btn" id="fn-all">x²/4 · ℝ</button><button class="btn" id="fn-cube">x³/25 · ℝ</button>
</div>
<div id="trace" hidden>
<label class="form-label">Posição de P · recorte visível<input class="form-range" id="t" type="range" min="-4" max="4" step="0.02" value="0"></label>
<div class="row"><button class="btn" id="scan">Varrer</button><button class="btn" id="clear">Limpar rastro</button><button class="btn advance" id="to-test">Continuar</button></div>
<div class="row"><label class="form-check"><input class="form-check-input" id="full" type="checkbox"><span class="form-check-label">Curva refletida</span></label><label class="form-check"><input class="form-check-input" id="proj" type="checkbox" checked><span class="form-check-label">Projeções</span></label></div>
</div>
<div id="test" hidden><div class="row"><button class="btn" id="yes">Sim</button><button class="btn" id="no">Não</button><button class="btn" id="return-trace">Explorar mais</button></div></div>
<div class="feedback" id="feedback" role="status" aria-live="polite"><span class="message" id="message"></span><span class="spark" style="--sx:36px;--sy:-15px" aria-hidden="true"></span><span class="spark" style="--sx:-36px;--sy:-15px" aria-hidden="true"></span><span class="spark" style="--sx:20px;--sy:16px" aria-hidden="true"></span><span class="spark" style="--sx:-20px;--sy:16px" aria-hidden="true"></span></div>
<div class="row" id="navigation" hidden><button class="btn" id="change-function">Trocar função</button><button class="btn" id="review">Rever conjectura</button></div>
</div>
</body></html>
